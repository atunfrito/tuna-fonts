# Al subir un tag vX.Y.Z: compila el instalador NSIS y el zip portable desde el
# código del tag, calcula sus SHA-256 y lo deja todo en una release BORRADOR con
# las notas de .github/notas/vX.Y.Z.md. Se publica a mano después de revisarla.
#
# Lanzado a mano (workflow_dispatch) solo compila: sube los archivos como
# artifact del run y no crea ni toca ninguna release.
#
# No hace falta ningún secret: tuna-fonts no lleva actualizador ni firma.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Crear la release y subirle archivos. Nada más.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ES_TAG: ${{ github.ref_type == 'tag' }}
      TAG: ${{ github.ref_name }}
    steps:
      # Acciones fijadas por commit: una etiqueta se puede mover, un SHA no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versión (y que el tag coincida)
        shell: pwsh
        run: |
          $paquete = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($paquete -ne $tauri) { throw "package.json $paquete, tauri.conf.json $tauri" }
          if ($env:ES_TAG -eq "true") {
            if ("v$paquete" -ne $env:TAG) { throw "tag $env:TAG, versión $paquete" }
            if (-not (Test-Path ".github/notas/$env:TAG.md")) { throw "falta .github/notas/$env:TAG.md" }
          }
          "VERSION=$paquete" >> $env:GITHUB_ENV

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Dependencias (versiones exactas del lockfile)
        run: npm ci

      - name: Compilar el instalador
        run: npm run instalador -- --ci

      # Después de compilar: el build de Rust necesita la interfaz ya generada en dist/.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Zip portable y SHA-256
        shell: pwsh
        run: |
          $v = $env:VERSION
          $setup = Get-Item "src-tauri/target/release/bundle/nsis/tuna-fonts_${v}_x64-setup.exe"

          # Portable: el .exe con las licencias al lado, como el instalador.
          $dir = New-Item -ItemType Directory -Force "salida/portable/tuna-fonts"
          Copy-Item src-tauri/target/release/tuna-fonts.exe $dir
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Copy-Item THIRD-PARTY-NOTICES.md $dir
          Copy-Item licenses "$dir/licenses" -Recurse
          Compress-Archive "$dir/*" "salida/tuna-fonts_${v}_x64-portable.zip"
          Copy-Item $setup salida/

          Push-Location salida
          $sumas = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sumas | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          Get-Content salida/SHA256SUMS.txt

      - name: Archivos del run (solo a mano)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuna-fonts-${{ env.VERSION }}-${{ github.sha }}
          path: |
            salida/*.exe
            salida/*.zip
            salida/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release borrador
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $cuerpo = (Get-Content ".github/notas/$env:TAG.md" -Raw).TrimEnd()
          $tres = [string][char]96 * 3
          $cuerpo += "`n`n### SHA-256`n$tres`n" + ((Get-Content salida/SHA256SUMS.txt) -join "`n") + "`n$tres`n"
          $cuerpo | Set-Content notas.md -Encoding utf8
          $archivos = @(Get-ChildItem salida -File | ForEach-Object FullName)
          gh release create $env:TAG --draft --verify-tag --title "tuna-fonts $env:TAG" --notes-file notas.md @archivos
