# Al publicar una release (no los borradores): manda la versión nueva a
# winget-pkgs con komac, que abre la pull request desde tu fork.
#
# Solo sirve a partir de que tuna-fonts ya esté en winget: la primera versión
# se envía a mano (ver winget/README.md).
#
# Secret: WINGET_TOKEN, un token clásico con el permiso public_repo, de la
# cuenta que tiene el fork de microsoft/winget-pkgs. Sin él, no hace nada.
name: winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ya publicado (vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      KOMAC: "2.17.2"
      KOMAC_SHA256: "38a5a53b2291e959157a46a9ed2f20c1c66e9e238666780519650fcc8d37ad58"
    steps:
      - name: Enviar a winget
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Warning "falta el secret WINGET_TOKEN: no se envía nada"; exit 0 }
          $v = $env:TAG.TrimStart("v")
          # komac en una versión fija, comprobada por su SHA-256.
          $exe = "komac.exe"
          Invoke-WebRequest "https://github.com/russellbanks/Komac/releases/download/v$env:KOMAC/komac-$env:KOMAC-x86_64-pc-windows-msvc.exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $env:KOMAC_SHA256) { throw "el SHA-256 de komac no cuadra" }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/tuna-fonts_${v}_x64-setup.exe"
          ./komac.exe update AtunFrito.TunaFonts --version $v --urls $url --release-notes-url "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$v" --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
